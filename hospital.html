<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Management System</title>
<style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { margin: 0; background: #f0f4f8; }
    header { background: #1e90ff; color: white; text-align: center; padding: 1rem; font-size: 1.5rem; }
    .container { display: flex; min-height: 90vh; }
    nav { width: 20%; background: #fff; padding: 1rem; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
    nav button { display: block; width: 100%; margin: 10px 0; padding: 10px; border: none; background: #1e90ff; color: white; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    nav button:hover { background: #0d6efd; }
    main { flex: 1; padding: 2rem; }
    .section { display: none; animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    input, select { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #1e90ff; color: white; }
    .btn { background: #1e90ff; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<header>🏥 Hospital Management System</header>

<div class="container">
    <nav>
        <button onclick="showSection('patients')">Patients</button>
        <button onclick="showSection('appointments')">Appointments</button>
        <button onclick="showSection('doctors')">Doctors</button>
    </nav>

    <main>
        <section id="patients" class="section">
            <h2>Register Patient</h2>
            <input type="text" id="pName" placeholder="Full Name">
            <input type="number" id="pAge" placeholder="Age">
            <select id="pGender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
            <button class="btn" onclick="addPatient()">Add Patient</button>

            <h3>Patient List</h3>
            <table id="patientTable">
                <tr><th>Name</th><th>Age</th><th>Gender</th></tr>
            </table>
        </section>

        <section id="appointments" class="section">
            <h2>Book Appointment</h2>
            <input type="text" id="aName" placeholder="Patient Name">
            <input type="text" id="aDoctor" placeholder="Doctor Name">
            <input type="date" id="aDate">
            <button class="btn" onclick="addAppointment()">Book</button>

            <h3>Appointment List</h3>
            <table id="appointmentTable">
                <tr><th>Patient</th><th>Doctor</th><th>Date</th></tr>
            </table>
        </section>

        <section id="doctors" class="section">
            <h2>Doctor List</h2>
            <table>
                <tr><th>Name</th><th>Specialization</th></tr>
                <tr><td>Dr. Meera Sharma</td><td>Cardiologist</td></tr>
                <tr><td>Dr. Arjun Patel</td><td>Orthopedic</td></tr>
                <tr><td>Dr. Aisha Khan</td><td>Neurologist</td></tr>
            </table>
        </section>
    </main>
</div>

<script>
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }
    showSection('patients');

    function addPatient() {
        let name = document.getElementById('pName').value.trim();
        let age = document.getElementById('pAge').value.trim();
        let gender = document.getElementById('pGender').value;
        if (!name || !age || !gender) return alert('Please fill all fields');
        let table = document.getElementById('patientTable');
        let row = table.insertRow();
        row.insertCell(0).innerText = name;
        row.insertCell(1).innerText = age;
        row.insertCell(2).innerText = gender;
        document.getElementById('pName').value = '';
        document.getElementById('pAge').value = '';
        document.getElementById('pGender').value = '';
    }

    function addAppointment() {
        let name = document.getElementById('aName').value.trim();
        let doctor = document.getElementById('aDoctor').value.trim();
        let date = document.getElementById('aDate').value;
        if (!name || !doctor || !date) return alert('Please fill all fields');
        let table = document.getElementById('appointmentTable');
        let row = table.insertRow();
        row.insertCell(0).innerText = name;
        row.insertCell(1).innerText = doctor;
        row.insertCell(2).innerText = date;
        document.getElementById('aName').value = '';
        document.getElementById('aDoctor').value = '';
        document.getElementById('aDate').value = '';
    }
</script>

</body>
</html>
